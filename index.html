<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HIMAVAT — The Descent | Indian Himalaya Field Atlas &amp; Trekking Planner</title>
    <meta
      name="description"
      content="Walk from dawn snow summit to base camp across the Indian Himalayas. Compare 18 verified trails across Uttarakhand, Himachal, Ladakh, Sikkim &amp; Kashmir, plan DIY budgets, and check live permits."
    />
    <meta name="theme-color" content="#0B1117" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HIMAVAT — The Descent | Indian Himalaya Trekking &amp; DIY Planner" />
    <meta
      property="og:description"
      content="Scroll-driven field atlas of India's iconic Himalayan treks with honest operator vs DIY cost breakdowns, permit guides, and AMS safety protocols."
    />
    <meta property="og:image" content="__BASE__images/hero-dawn/1920.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="__BASE__favicon.svg" />

    <!-- Preload ONLY the headline font per specification -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="__BASE__fonts/montserrat-900.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="__BASE__images/hero-dawn/480.avif 480w, __BASE__images/hero-dawn/960.avif 960w, __BASE__images/hero-dawn/1920.avif 1920w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- Self-hosted subset fonts with font-display: swap and exact subpath resolution -->
    <style>
      @font-face {
        font-family: 'Montserrat';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('__BASE__fonts/montserrat-700.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Montserrat';
        font-style: normal;
        font-weight: 900;
        font-display: swap;

      }
      @font-face {
        font-family: 'Cormorant Garamond';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('__BASE__fonts/cormorant-400i.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Cormorant Garamond';
        font-style: italic;
        font-weight: 600;

      @font-face {
        font-family: 'Montserrat Fallback';
        src: local('Liberation Sans Bold'), local('DejaVu Sans Bold'), local('Arial Black'), local('Helvetica Bold');
        size-adjust: 109%;
        ascent-override: 96%;
        descent-override: 24%;
      }
      @font-face {
        font-family: 'DM Sans Fallback';
        src: local('Liberation Sans'), local('DejaVu Sans'), local('Arial'), local('Helvetica');
        size-adjust: 101%;
        ascent-override: 95%;
        descent-override: 25%;

        size-adjust: 108%;
        ascent-override: 94%;
        descent-override: 26%;
      }
    </style>
